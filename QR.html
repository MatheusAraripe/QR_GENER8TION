<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de QR Code SVG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  </head>
  <body
    class="bg-[#f8f8f8] h-screen flex flex-col items-center justify-center font-sans text-black selection:bg-black selection:text-white"
  >
    <div
      class="w-full max-w-sm p-8 bg-white border border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]"
    >
      <h1 class="text-xl font-bold uppercase tracking-tight mb-6">
        QR_Generator
      </h1>

      <div class="flex flex-col gap-5">
        <!-- Entrada de Texto para o Link -->
        <input
          type="url"
          id="linkInput"
          placeholder="Cole o link do site aqui..."
          class="w-full p-3 border border-black focus:outline-none focus:ring-1 focus:ring-black bg-transparent placeholder-gray-400 text-sm"
        />

        <!-- Entradas de Cor -->
        <div class="flex gap-4">
          <div class="w-full">
            <label
              for="darkColor"
              class="block text-[10px] font-bold uppercase tracking-widest mb-2"
              >Cor do Código</label
            >
            <input
              type="color"
              id="darkColor"
              value="#000000"
              class="w-full h-10 p-0.5 cursor-pointer bg-white border border-black focus:outline-none"
            />
          </div>
          <div class="w-full">
            <label
              for="lightColor"
              class="block text-[10px] font-bold uppercase tracking-widest mb-2"
              >Cor do Fundo</label
            >
            <input
              type="color"
              id="lightColor"
              value="#ffffff"
              class="w-full h-10 p-0.5 cursor-pointer bg-white border border-black focus:outline-none"
            />
          </div>
        </div>

        <!-- Botão de Ação -->
        <button
          id="generateBtn"
          class="w-full p-3 bg-black text-white uppercase text-sm font-bold tracking-widest hover:bg-gray-800 transition-colors"
        >
          Gerar SVG
        </button>
      </div>

      <!-- Contêiner do Resultado -->
      <div id="qrContainer" class="mt-8 hidden flex-col items-center gap-4">
        <div
          id="qrCode"
          class="border border-gray-200 p-4 bg-white w-full flex justify-center"
        ></div>

        <a
          id="downloadBtn"
          class="text-xs font-semibold uppercase tracking-widest underline hover:no-underline cursor-pointer"
        >
          ↓ Baixar Arquivo .SVG
        </a>
      </div>
    </div>

    <script>
      const linkInput = document.getElementById("linkInput");
      const darkColorInput = document.getElementById("darkColor");
      const lightColorInput = document.getElementById("lightColor");
      const generateBtn = document.getElementById("generateBtn");
      const qrContainer = document.getElementById("qrContainer");
      const qrCodeDiv = document.getElementById("qrCode");
      const downloadBtn = document.getElementById("downloadBtn");

      generateBtn.addEventListener("click", () => {
        const url = linkInput.value.trim();
        const darkColor = darkColorInput.value;
        const lightColor = lightColorInput.value;

        if (!url) {
          alert("Por favor, insira um link.");
          return;
        }

        QRCode.toString(
          url,
          {
            type: "svg",
            color: {
              dark: darkColor, // Recebe a cor escolhida para os blocos
              light: lightColor, // Recebe a cor escolhida para o fundo
            },
            margin: 1,
          },
          function (err, svgString) {
            if (err) {
              console.error(err);
              return;
            }

            qrContainer.classList.remove("hidden");
            qrContainer.classList.add("flex");

            qrCodeDiv.innerHTML = svgString;

            // Força o tamanho do SVG gerado para caber bem no contêiner
            const svgElement = qrCodeDiv.querySelector("svg");
            if (svgElement) {
              svgElement.style.width = "100%";
              svgElement.style.maxWidth = "200px";
              svgElement.style.height = "auto";
            }

            const blob = new Blob([svgString], { type: "image/svg+xml" });
            const urlBlob = URL.createObjectURL(blob);

            downloadBtn.href = urlBlob;
            downloadBtn.download = "qrcode.svg";
          },
        );
      });
    </script>
  </body>
</html>
